# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries
# For pytest-qt related fixes: https://pytest-qt.readthedocs.io/en/latest/troubleshooting.html#github-actions

name: tests

on:
  pull_request:
    paths-ignore:
      - "**/README.md"
      - "docs/**"
  push:
    paths-ignore:
      - "**/README.md"
      - "docs/**"

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Install Core and test on Ubuntu (Linux - Ubuntu 22.04)
  # ------------------------------------------------------------------
  test-core:
    name: Core Tests (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      # Miniforge + conda-forge only, matching the environment docs/installation.md
      # tells users to build. Miniconda's `defaults` channel resolves different
      # package versions, so CI was not testing what users actually install.
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"
          auto-update-conda: true
          activate-environment: test
          python-version: ${{ matrix.python-version }}
          channels: conda-forge

      # Standard path for Linux linter
      - name: Save conda location
        run: echo "python=$(which python)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.17"

      - name: Install core
        timeout-minutes: 10
        run: |
          # Install dependencies
          # We include types-PyYAML here too for linux linting consistency
          # openssl 3.6.3 cannot parse DER certificates, which breaks
          # ssl.create_default_context() and therefore every dask compute.
          conda install -y pyqt pyopencl pocl pytest-qt "openssl!=3.6.3" 
          
          uv pip install --upgrade pip setuptools wheel
          uv pip install -e './core[testing]'

      - name: Verify TLS stack
        run: |
          conda list openssl
          python -c "import ssl; print(ssl.OPENSSL_VERSION); ssl.create_default_context(); import distributed; print('TLS OK')"

      - name: Lint core
        uses: ./.github/lint
        with:
          directory: core
          python: ${{ env.python }}

      - name: Test core
        run: pytest --verbose --verbose core/

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          flags: core
  # ------------------------------------------------------------------
  # JOB 2: Install Plugin and test on Windows
  # ------------------------------------------------------------------
  test-plugin:
    name: Plugin Tests (Windows)
    runs-on:  ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"] #just run on 3.11 for windows for now
        os: [windows-latest]

    env:
      QT_API: pyqt6
      # pytest-qt reads PYTEST_QT_API, not QT_API. Without it, it guesses a backend
      # and any import failure comes up as an unclear INTERNALERROR 
      PYTEST_QT_API: pyqt6
    steps:
      - uses: actions/checkout@v6

      # Miniforge + conda-forge only, matching the environment docs/installation.md
      # tells users to build. Miniconda's `defaults` channel resolves different
      # package versions, so CI was not testing what users actually install.
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"
          auto-update-conda: true
          activate-environment: test
          python-version: ${{ matrix.python-version }}
          channels: conda-forge

      - name: Save conda location
        run: echo "python=$(which python)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.17"

      - name: Install core & plugin
        timeout-minutes: 10
        run: |
          # openssl 3.6.3 cannot parse DER certificates, which breaks
          # ssl.create_default_context() and therefore every dask compute.
          #
          # Keep  list minimal: conda supplies only the OpenCL runtime. Taking
          # pyopencl from conda drags in numpy -> mkl -> tbb -> libhwloc -> libxml2
          # -> icu, and icu ships an unversioned icuuc.dll that shadows the System32
          # one PyQt6's Qt6Core.dll is built against, breaking `import PyQt6.QtCore`
          # with a DLL error before any test runs. pyopencl, qtpy, pytest-qt and
          # typing-extensions all arrive via pip, so conda has no reason to hold them.
          conda install -y oclgrind khronos-opencl-icd-loader "openssl!=3.6.3"
          uv pip install --upgrade pip setuptools wheel
          # Install core and plugin
          uv pip install -e './core[testing]'
          uv pip install -e './plugin[testing]'
          # ci only as pyopencl 2026.1.3 fails on windows; drop in next pyopencl release
          uv pip install "pyopencl<=2026.1.2"

      # Fails loudly here rather than inside an unrelated napari traceback. Any
      # dask compute imports `distributed`, which builds an SSL context at import
      # time via tornado, which reads the Windows certificate store.
      - name: Verify TLS stack
        run: |
          conda list openssl
          python -c "import ssl; print(ssl.OPENSSL_VERSION); ssl.create_default_context(); import distributed; print('TLS OK')"

      - name: Register oclgrind OpenCL ICD
        shell: pwsh
        run: |
          # Find oclgrind DLL 
          # $CONDA is exported by setup-miniconda and points at the installation
          # root. Do not hardcode C:\Miniconda: the Miniforge installer path differs.
          $dll = Get-ChildItem "$env:CONDA\envs\test\Library\bin" -Filter "*oclgrind*" | Select-Object -First 1
          Write-Host "Found: $($dll.FullName)"
          $regPath = "HKLM:\SOFTWARE\Khronos\OpenCL\Vendors"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          New-ItemProperty -Path $regPath -Name $dll.FullName -Value 0 -PropertyType DWORD -Force | Out-Null
          Write-Host "Registered oclgrind in OpenCL ICD registry"
      
      # strategy borrowed from vispy for installing opengl libs on windows
      - name: Install Windows OpenGL
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1
          
      - name: Lint plugin
        uses: ./.github/lint
        with:
          directory: plugin
          python: ${{ env.python }}

      - name: Test plugin
        timeout-minutes: 18
        run: pytest -v --cov=plugin --cov-report=xml plugin

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          flags: plugin
  # ------------------------------------------------------------------
  # JOB 3: Release on PyPI 
  # ------------------------------------------------------------------

  deploy:
    # run this job only for tag refs (e.g. refs/tags/v1.2.3)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-core, test-plugin]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.17"
      - name: Install dependencies
        run: |
          uv pip install --system --upgrade pip setuptools wheel
          # Only install what's needed for building the package
          uv pip install --system ./core[deploy]
          uv pip install --system ./plugin

      - name: Build distributions
        run: |
          python -m build core
          python -m build plugin

      - uses: ncipollo/release-action@v1.21.0 #Create a release when tag is pushed
        name: Create GitHub release
        with:
          skipIfReleaseExists: true
          artifacts: "core/dist/*,plugin/dist/*"

      - name: Release on PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_TOKEN }}
        run: |
          twine upload --skip-existing --non-interactive core/dist/*
          twine upload --skip-existing --non-interactive plugin/dist/*
